[package]
name = "tui-music"
version = "0.1.23"
edition = "2021"
authors = ["Shiorangerin <141531482+Shiorangerin@users.noreply.github.com>"]

[lib]
name = "tui_music"
path = "src/lib.rs"

[[bin]]
name = "tui-music"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rodio = "0.20"
rustfft = "6.2"
anyhow = "1.0"
walkdir = "2.5"
lofty = "0.22"
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3"
block2 = "0.6"

[profile.release]
opt-level = 3
lto = "thin"